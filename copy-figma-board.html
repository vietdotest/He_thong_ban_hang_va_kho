<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Copy Figma Day 1–2 Board</title>
  <style>
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#111827;color:#fff;display:grid;place-items:center;min-height:100vh}
    main{width:min(1100px,92vw);text-align:center}.preview{width:100%;border-radius:18px;box-shadow:0 24px 80px #0008;border:1px solid #ffffff24}
    button{margin:28px 0 12px;border:0;border-radius:14px;padding:16px 24px;background:#4f46e5;color:white;font-weight:700;font-size:16px;cursor:pointer}
    textarea{display:block;width:100%;height:72px;margin-top:16px;border-radius:12px;background:#0b1020;color:#a5b4fc;border:1px solid #ffffff24;padding:12px;box-sizing:border-box;font:12px ui-monospace,monospace}
    p{color:#a5b4fc}#status{color:#5eead4;min-height:24px}
  </style>
</head>
<body>
  <main>
    <h1>Sprint 1 — Day 1–2</h1>
    <p>Bản thiết kế vector đã render ở độ phân giải 4620 × 3040.</p>
    <img id="design" class="preview" src="figma-day-1-2-sprint.png" alt="Figma Day 1–2 Board" />
    <button id="copy">Copy thiết kế vào clipboard</button>
    <div id="status"></div>
    <textarea id="svgSource" aria-label="SVG source" readonly></textarea>
  </main>
  <script>
    const img = document.getElementById('design');
    const status = document.getElementById('status');
    fetch('figma-day-1-2-compatible.svg').then(response => response.text()).then(source => {
      document.getElementById('svgSource').value = source;
    });
    document.getElementById('copy').addEventListener('click', async () => {
      try {
        status.textContent = 'Đang chuẩn bị ảnh…';
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        status.textContent = 'Đã copy. Có thể dán vào Figma.';
      } catch (error) {
        status.textContent = 'Không thể copy: ' + error.message;
      }
    });
  </script>
</body>
</html>
